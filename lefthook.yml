pre-commit:
  parallel: true
  scripts:
    'protect-main.sh':
      runner: sh
  commands:
    lint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
      run: npm exec --no -- oxlint --deny-warnings {staged_files}
    format:
      run: npm exec --no -- oxfmt --check {staged_files}

pre-push:
  parallel: true
  scripts:
    'protect-main.sh':
      runner: sh
      use_stdin: true
  commands:
    typecheck:
      run: npm run typecheck
